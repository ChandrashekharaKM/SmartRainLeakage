{% extends "base.html" %}

{% block title %}Sign In - SmartRain Water Monitoring{% endblock %}

{% block content %}
<div style="display: flex; justify-content: center; align-items: center; min-height: 70vh;">
  <div class="glass-card" style="width: 100%; max-width: 440px; padding: 2.5rem; text-align: center;">
    
    <div style="display: flex; justify-content: center; margin-bottom: 1.25rem;">
      <div class="brand-icon" style="width: 56px; height: 56px; font-size: 1.75rem;">💧</div>
    </div>

    <h2 style="font-size: 1.8rem; margin-bottom: 0.5rem; font-weight: 700;">SmartRain Portal</h2>
    <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 2rem;">
      Sign in to monitor household water telemetry &amp; leak detection
    </p>

    <form method="POST" action="{{ url_for('login') }}">
      <div class="form-group" style="text-align: left;">
        <label class="form-label" for="username">Username</label>
        <input type="text" class="form-input" id="username" name="username" placeholder="demo" required autofocus>
      </div>

      <div class="form-group" style="text-align: left;">
        <label class="form-label" for="password">Password</label>
        <input type="password" class="form-input" id="password" name="password" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary" id="btnSubmitLogin" style="width: 100%; margin-top: 1rem; padding: 0.85rem;">
        Sign In to Dashboard
      </button>
    </form>

    <div style="margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--border-subtle); text-align: left;">
      <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600;">
        Quick Demo Credentials:
      </p>
      <div style="display: flex; gap: 0.5rem;">
        <button type="button" class="btn btn-secondary btn-sm" style="flex: 1;" onclick="fillCreds('demo', 'demo123')">
          👤 User (demo)
        </button>
        <button type="button" class="btn btn-secondary btn-sm" style="flex: 1;" onclick="fillCreds('admin', 'admin123')">
          🛡️ Admin (admin)
        </button>
      </div>
    </div>

  </div>
</div>

<script>
  function fillCreds(u, p) {
    document.getElementById('username').value = u;
    document.getElementById('password').value = p;
  }
</script>
{% endblock %}
